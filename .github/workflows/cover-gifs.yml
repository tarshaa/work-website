name: One-time cover GIF publication
on:
  push:
    branches: [autoplay-cover-gifs-20261114]
    paths:
      - .github/workflows/cover-gifs.yml
      - scripts/build-cover-gifs.py
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install conversion tools
        run: python -m pip install imageio-ffmpeg==0.6.0 Pillow==11.3.0
      - name: Convert and validate full-resolution covers
        run: python scripts/build-cover-gifs.py
      - name: Save generated GIFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*-loop.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Generate native-resolution autoplay cover GIFs'
            git push origin HEAD
          fi
